name: voice-image

# Builds the read-aloud voice (voice-space/: MMS-TTS behind FastAPI, the three voices baked in)
# and publishes it to GHCR, where Modal pulls it from.
on:
  push:
    branches: [main]
    paths: ['voice-space/**', '.github/workflows/voice-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:voice-space"
          push: true
          tags: |
            ghcr.io/armaanmittalweb/farmsaathi-voice:latest
            ghcr.io/armaanmittalweb/farmsaathi-voice:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/armaanmittalweb/FarmSathi
          cache-from: type=gha
          cache-to: type=gha,mode=max
